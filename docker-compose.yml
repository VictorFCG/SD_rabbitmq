services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-ecommerce
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  rabbitmq-data:
